<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside id="sidebar">
      <button id="new-chat" type="button">+ New chat</button>
      <div class="side-label">History</div>
      <nav id="conversations"></nav>
      <div id="health"></div>
    </aside>
    <main>
      <div id="thread">
        <div id="empty">
          <h1>Ask anything.</h1>
          <p>I search the web when facts may have changed, and I remember what you asked and when, across chats.</p>
          <div class="suggestions">
            <button>What's new in the latest Node.js release?</button>
            <button>Compare Neon, Supabase and RDS for Postgres hosting pricing</button>
            <button>What did I ask you yesterday? Is the answer still correct?</button>
          </div>
        </div>
      </div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
        <button id="send" type="submit" aria-label="Send">↑</button>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
